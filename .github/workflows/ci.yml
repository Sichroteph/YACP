name: CI (build)

on:
  push:
    branches: [master, main, chore/sync-crosspoint]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  source-policy:
    name: YACP source and layout checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Register this fresh YACP checkout
        run: python scripts/check_yacp_source.py --register

      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.3

      - name: Prepare host checks from a clean checkout
        run: |
          mkdir -p qa-artifacts
          python scripts/gen_i18n.py

      - name: Verify source authority failure paths
        run: python -m unittest discover -s test -p 'test_yacp*.py' -v

      - name: Check bounded Home menu geometry
        run: |
          mkdir -p qa-artifacts
          g++ -std=c++17 -Isrc test/yacp_home_layout/HomeMenuLayoutTest.cpp -o qa-artifacts/home-layout-check
          qa-artifacts/home-layout-check

      - name: Check the existing board tag scanner at every chunk boundary
        run: |
          mkdir -p qa-artifacts
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -DFREEINK_DEVICE_X3=1 -Itest/yacp_install -Isrc/network test/yacp_install/BoardTagTest.cpp src/network/FirmwareBoardTag.cpp -o qa-artifacts/board-tag-check
          qa-artifacts/board-tag-check

  build:
    name: Build all six YACP profiles
    needs: source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install pinned PlatformIO Core and builder dependencies
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: yacp-pio-v1-${{ runner.os }}-${{ hashFiles('platformio.ini', '.yacp-source.json', 'scripts/patch_pioarduino_cache.py') }}
          restore-keys: yacp-pio-v1-${{ runner.os }}-

      - name: Register this fresh YACP checkout
        run: python scripts/check_yacp_source.py --register

      - name: Install font rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6

      - name: Pin the nested framework builder core
        run: |
          set -euo pipefail
          pio pkg install -e tiny
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19" \
            "freetype-py==2.5.1" "fonttools==4.61.1" "Pillow==12.1.0" "PyYAML==6.0.3"
          ~/.platformio/penv/bin/pio --version

      - name: Reserve a diagnostic range for this workflow run
        env:
          YACP_CI_RUN: ${{ github.run_number }}
          YACP_CI_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          path = Path('platformio.ini')
          text = path.read_text(encoding='utf-8')
          pattern = r'(?m)^(crossink_version\s*=\s*)([^\s]+-yacp\.)(\d+)(\s*)$'
          match = re.search(pattern, text)
          if not match:
              raise SystemExit('Expected a numbered YACP diagnostic version')
          seed = int(match[3]) + int(os.environ['YACP_CI_RUN']) * 1000 + int(os.environ['YACP_CI_ATTEMPT']) * 10
          text = text[:match.start()] + match[1] + match[2] + str(seed) + match[4] + text[match.end():]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build and verify all three Standard firmware profiles
        run: python scripts/build_yacp.py all-local --pio ~/.platformio/penv/bin/pio

      - name: Retain verified images and build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: YACP-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            qa-artifacts/bin/*.bin
            qa-artifacts/bin/*.json
            qa-artifacts/build-*.log
            qa-artifacts/ticket-*.json
          if-no-files-found: error

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev

      - name: Cache googletest source
        uses: actions/cache@v4
        with:
          path: build/test/_deps/googletest-src
          key: ${{ runner.os }}-googletest-${{ hashFiles('test/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - source-policy
      - unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
